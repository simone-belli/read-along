<style>
  :root {
    --bg: #1e1e1e;
    --bar: rgba(30, 30, 30, 0.94);
    --border: #3c3c3c;
    --text: #d4d4d4;
    --heading: #ececec;
    --dim: #6b6b6b;
    --accent: #3794ff;
    --link: #4daafc;
    --code-bg: #2b2b2b;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.65;
  }

  /* ---------- toolbar ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--bar);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
  }
  .toolbar-inner {
    max-width: 880px; margin: 0 auto; padding: 10px 20px 8px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; color: var(--heading); margin-right: 6px; white-space: nowrap; }
  .logo { fill: var(--accent); }
  .brand .logo { width: 28px; height: 28px; flex: none; }
  .hero { text-align: center; margin-bottom: 8px; }
  .hero .logo { width: 96px; height: 96px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .btn, button, select {
    font: inherit; font-size: 13px; color: var(--text);
    background: #2d2d2d; border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 10px; cursor: pointer;
  }
  .btn:hover, button:hover:not(:disabled) { background: #383838; }
  button:disabled { opacity: 0.4; cursor: default; }
  a.brand { text-decoration: none; }
  .filename {
    color: var(--dim); font-size: 13px; max-width: 280px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .loaded { color: var(--dim); font-size: 12px; white-space: nowrap; margin-left: -4px; }
  #reload { padding: 5px 8px; margin-left: -4px; }
  #reload svg { width: 14px; height: 14px; fill: currentColor; vertical-align: -2px; }
  .field { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .field select { max-width: 220px; }
  .transport { display: flex; gap: 6px; }
  .transport button { width: 34px; height: 30px; padding: 0; display: grid; place-items: center; }
  .transport svg { width: 15px; height: 15px; fill: currentColor; }
  #play { width: 42px; background: var(--accent); border-color: var(--accent); color: #fff; }
  #play:hover:not(:disabled) { background: #2a7fe0; }
  #scrub { flex: 1; min-width: 120px; accent-color: var(--accent); cursor: pointer; }
  .time { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 90px; text-align: right; }
  .status { font-size: 12px; color: var(--dim); min-height: 1.2em; }
  .notice {

  .notice button:hover:not(:disabled) { background: #2a7fe0; }

  /* ---------- document (approximates Cursor / VS Code Markdown preview) ---------- */
  main { max-width: 880px; margin: 0 auto; padding: 28px 20px 45vh; }
  #doc h1, #doc h2, #doc h3, #doc h4, #doc h5, #doc h6 {
    color: var(--heading); font-weight: 600; line-height: 1.25; margin: 1.5em 0 0.6em;
  }
  #doc h1 { font-size: 2em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; margin-top: 0.2em; }
  #doc h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
  #doc h3 { font-size: 1.25em; }
  #doc p, #doc ul, #doc ol, #doc blockquote, #doc pre, #doc table { margin: 0 0 1em; }
  #doc ul, #doc ol { padding-left: 2em; }
  #doc li + li { margin-top: 0.25em; }
  #doc a { color: var(--link); text-decoration: none; }
  #doc a:hover { text-decoration: underline; }
  #doc code {
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 0.88em;
    background: var(--code-bg); padding: 0.15em 0.35em; border-radius: 4px;
  }
  #doc pre {
    background: #161616; border: 1px solid var(--border); border-radius: 6px;
    padding: 12px 14px; overflow: auto;
  }
  #doc pre code { background: none; padding: 0; font-size: 13px; }
  #doc blockquote { border-left: 4px solid #555; margin-left: 0; padding: 0 1em; color: #a8a8a8; }
  #doc table { border-collapse: collapse; }
  #doc th, #doc td { border: 1px solid var(--border); padding: 6px 12px; }
  #doc th { background: #252526; }
  #doc hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
  #doc img { max-width: 100%; }
  #doc .math.display { display: block; overflow-x: auto; overflow-y: hidden; margin: 0.6em 0; }
  /* MathJax glyphs are thinner than body text, so give them the brighter heading colour.
     Set on .math itself so the session's grey (#doc.active) never reaches them: unread
     formulas are dimmed with opacity alone, read ones are back to full brightness. */
  #doc .math { color: var(--heading); }

  /* ---------- read-along state ----------
     While a session is active, unread text is grey; what has been read turns bright,
     the current sentence is tinted, the current word is marked. */
  #doc.active, #doc.active :is(h1, h2, h3, h4, h5, h6, blockquote) { color: var(--dim); }
  #doc.active pre { opacity: 0.45; }
  #doc.active .math { opacity: 0.4; transition: opacity 0.15s; }
  #doc.active .math.read { opacity: 1; }
  #doc.active pre.read { opacity: 1; }
  #doc [data-ra-stop] { outline: 2px solid var(--accent); outline-offset: 5px; border-radius: 6px; opacity: 1 !important; }
  #doc .math.now { background: rgba(55, 148, 255, 0.3); border-radius: 4px; }
  ::highlight(tts-read) { color: var(--text); }
  ::highlight(tts-sentence) { background-color: rgba(55, 148, 255, 0.13); }
  ::highlight(tts-word) { background-color: rgba(55, 148, 255, 0.45); color: #fff; }

  /* Fallback for browsers without the CSS Custom Highlight API: tint the current block */
  .no-hl #doc.active, .no-hl #doc.active :is(h1, h2, h3, h4, h5, h6) { color: var(--text); }
  .no-hl #doc.active .math { opacity: 1; }
  #doc [data-ra-current] { background: rgba(55, 148, 255, 0.13); box-shadow: 0 0 0 4px rgba(55, 148, 255, 0.13); border-radius: 3px; }

  .credit {
    margin-top: 3em; padding-top: 1em; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--dim); text-align: center;
  }
  .credit .logo { width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; }

  /* ---------- drag & drop ---------- */
  .drop {
    position: fixed; inset: 0; z-index: 20; display: none; place-items: center;
    background: rgba(20, 20, 20, 0.85); border: 3px dashed var(--accent);
    font-size: 18px; color: var(--text); pointer-events: none;
  }
  body.dragging .drop { display: grid; }
  .drop .logo { display: block; width: 120px; height: 120px; margin: 0 auto 16px; }

  /* ---------- settings ---------- */
  .settings { padding-top: 4px; border-top: 1px dashed var(--border); }
  .settings input[type=password] {
    font: inherit; font-size: 13px; color: var(--text); width: 240px;
    background: #1a1a1a; border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px;
  }
  .settings .note { font-size: 12px; color: var(--dim); }
  #gear { padding: 5px 8px; }
  #gear svg { width: 15px; height: 15px; fill: currentColor; vertical-align: -2px; }

  @media (max-width: 640px) {
    .field select { max-width: 150px; }
    .time { min-width: 0; }
  }
</style>

<script type="text/markdown" id="sample">
# Read Along

This page reads Markdown aloud while you follow the text. Unread text is grey, everything already spoken turns bright, the current sentence is tinted, and the word being spoken is marked.

## How to use it

- Press **Space** to play or pause, and the **left and right arrows** to step back or forward one sentence.
- Drag the bar to jump anywhere, or double-click any sentence to start reading from there.
- Open a `.md` file with the button above, drop one onto the page, or paste Markdown anywhere.
- For natural voices, open Settings (the gear icon), pick **ElevenLabs** as the engine and paste your API key. Voices are chosen there too.

## Maths

The Gaussian density with mean $\mu$ and variance $\sigma^2$ is

$$
f(x) = \frac{1}{\sqrt{2\pi\sigma^2}} \exp\left(-\frac{(x-\mu)^2}{2\sigma^2}\right)
$$

Formulas are spoken in a simplified way, but they are rendered exactly. Inline maths such as $e^{i\pi} + 1 = 0$ works too.

## Code is shown, not read

```python
def mean(xs):
    return sum(xs) / len(xs)
```

> Block quotes are read like any other paragraph.

| Key | Action |
|-----|--------|
| Space | Play or pause |
| Left / Right | Previous or next sentence |
| Esc | Stop |

<script src="engine.js"></script>
<script>
(() => {
  'use strict';

  // ======================================================================
  // DOM handles & small helpers
  // ======================================================================
  const $ = (id) => document.getElementById(id);
  const doc = $('doc'), toolbar = $('toolbar');
  const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ======================================================================
  // 1. Rendering: Markdown + LaTeX
  // ======================================================================
  const md = window.markdownit({
    html: false,
    linkify: true,
    typographer: true,
    highlight(str, lang) {
      if (window.hljs && lang && hljs.getLanguage(lang)) {
        try { return hljs.highlight(str, { language: lang, ignoreIllegals: true }).value; } catch { /* fall through */ }
      }
      return '';
    }
  });

  // Pull maths out before Markdown sees it (so _ and * inside formulas survive),
  // leaving code spans/blocks untouched.
  const MATH_RE = /(```[\s\S]*?```|~~~[\s\S]*?~~~|`[^`\n]+`)|\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$(?=\S)((?:\\\$|[^$\n])+?)(?<=\S)\$(?!\d)/g;

  function renderMarkdown(src) {
    const maths = [];
    const protectedSrc = src.replace(MATH_RE, (m, code, d1, d2, i1, i2) => {
      if (code) return m;
      const display = d1 != null || d2 != null;
      maths.push({ tex: (d1 ?? d2 ?? i1 ?? i2).trim(), display });
      return 'XMATHPH' + (maths.length - 1) + 'X';
    });
    return md.render(protectedSrc).replace(/XMATHPH(\d+)X/g, (m, i) => {
      const { tex, display } = maths[+i];
      const attr = escapeHtml(tex);
      return display
        ? `<span class="math display" data-tex="${attr}">\\[${attr}\\]</span>`
        : `<span class="math" data-tex="${attr}">\\(${attr}\\)</span>`;
    });
  }

  function mathJaxReady(timeoutMs = 8000) {
    return new Promise((resolve) => {
      const t0 = performance.now();
      (function check() {
        if (window.MathJax && MathJax.typesetPromise && MathJax.startup) {
          MathJax.startup.promise.then(() => resolve(true), () => resolve(false));
        } else if (performance.now() - t0 > timeoutMs) {
          resolve(false);
        } else {
          setTimeout(check, 50);
        }
      })();
    });
  }

  // ======================================================================
  // 2.–10., 12. Speakable maths, model, highlighting, both voice engines,
  //    transport, time display, settings and keyboard live in engine.js.
  // ======================================================================
  const UI_IDS = ['play', 'prev', 'next', 'stop', 'scrub', 'time', 'status', 'rate', 'follow', 'pauseBlocks', 'pauseBlocks2',
    'engine', 'voice', 'model', 'gear', 'settings', 'keyRow', 'apikey', 'saveKey', 'cancelKey', 'changeKey', 'keyStatus', 'credits'];
  const ra = ReadAlong.create({
    root: doc,
    ui: Object.fromEntries(UI_IDS.map((id) => [id, $(id)])),
    viewport: () => ({ top: toolbar.getBoundingClientRect().bottom + 16, bottom: window.innerHeight - 60 })
  });

  // ======================================================================
  // 11. Loading documents (button, drag & drop, paste)
  // ======================================================================
  let loadGen = 0;
  async function loadMarkdown(src, name, { keepScroll = false, status = '' } = {}) {
    const myLoad = ++loadGen;
    ra.stop();
    if (window.MathJax && MathJax.typesetClear) MathJax.typesetClear([doc]);
    const y = window.scrollY;
    doc.innerHTML = renderMarkdown(src);
    $('filename').textContent = name;
    $('hero').hidden = name !== 'Sample';   // big logo only on the welcome page
    document.title = name + ' · Read Along';
    window.scrollTo(0, keepScroll ? y : 0);
    ra.setStatus('Rendering…');

    const ok = await mathJaxReady();
    if (myLoad !== loadGen) return false;
    if (ok) { try { await MathJax.typesetPromise([doc]); } catch (e) { console.warn(e); } }
    if (myLoad !== loadGen) return false;

    ra.refresh();
    ra.setStatus(status + ra.summary());
    return true;
  }

  const showSample = () => { setCurrent(null); return loadMarkdown($('sample').textContent.trim(), 'Sample'); };
  $('home').addEventListener('click', (e) => { e.preventDefault(); showSample(); });

  // The last document is remembered, so the next visit opens it instead of the sample:
  // its text in localStorage and, where the browser allows it (Chrome, Edge), a handle to
  // the file in IndexedDB, so ↻ can reread it from disk and show whether it changed.
  const LAST_DOC = 'readalong.lastDoc';
  const canPick = typeof window.showOpenFilePicker === 'function';
  let current = null;        // { name, text, source: 'file' | 'paste', loadedAt, handle }
  let reloadNext = false;    // the next file opened through the picker answers ↻
  let needsCheck = false;    // the copy shown may be old: check the file on the next click

  const fileStore = (() => {   // own database: engine.js owns 'read-along' and its version
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open('read-along-files', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('handles');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
    const run = (mode, fn) => open().then((db) => new Promise((res, rej) => {
      const t = db.transaction('handles', mode), q = fn(t.objectStore('handles'));
      t.oncomplete = () => res(q.result);
      t.onerror = () => rej(t.error);
    }));
    return {
      get: () => run('readonly', (s) => s.get('last')).catch(() => null),
      set: (h) => run('readwrite', (s) => (h ? s.put(h, 'last') : s.delete('last'))).catch(() => {})
    };
  })();

  function ago(t) {
    const m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + (m === 1 ? ' minute ago' : ' minutes ago');
    const h = Math.round(m / 60);
    if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
    const d = Math.round(h / 24);
    return d === 1 ? 'yesterday' : d + ' days ago';
  }
  function showLoaded() {
    const isFile = current && current.source === 'file';
    $('reload').hidden = !isFile;
    $('loaded').textContent = isFile ? 'loaded ' + ago(current.loadedAt) : '';
  }
  setInterval(showLoaded, 60000);

  function setCurrent(c) {
    showStale(false);   // whatever is shown now was just read, or is another document
    current = c;
    showLoaded();
    if (!c) return;
    try { localStorage.setItem(LAST_DOC, JSON.stringify({ name: c.name, text: c.text, source: c.source, loadedAt: c.loadedAt })); }
    catch { try { localStorage.removeItem(LAST_DOC); } catch { /* storage unavailable */ } }
    fileStore.set(c.handle || null);
  }

  // Shows a file's text as it now is on disk; for an already open file only when it changed.
  async function showFile(text, name, handle, { reload = false, quiet = false } = {}) {
    const same = reload && current && current.source === 'file' && current.name === name;
    if (same && text === current.text) {
      setCurrent({ ...current, handle: handle || current.handle, loadedAt: Date.now() });
      if (!quiet) ra.setStatus('No changes: the file is the same as the version shown.');
      return;
    }
    setCurrent({ name, text, source: 'file', loadedAt: Date.now(), handle });
    await loadMarkdown(text, name, same ? { keepScroll: true, status: 'Updated: the file changed on disk. ' } : {});
  }

  const readFile = (f, handle = null, reload = false) => f.text().then((t) => showFile(t, f.name, handle, { reload }));
  $('file').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (f) readFile(f, null, reloadNext);
    reloadNext = false;
    e.target.value = '';
  });
  $('file').addEventListener('cancel', () => { reloadNext = false; });

  async function pickFile(reload = false) {
    if (!canPick) { reloadNext = reload; $('file').click(); return; }
    let handle;
    try {
      const startIn = current && current.handle;
      [handle] = await window.showOpenFilePicker({
        id: 'read-along',
        ...(startIn ? { startIn } : {}),
        types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown', '.mdown'], 'text/plain': ['.txt'] } }]
      });
    } catch (e) {
      if (e.name !== 'AbortError') { reloadNext = reload; $('file').click(); }   // picker refused: use the plain one
      return;
    }
    readFile(await handle.getFile(), handle, reload);
  }
  // In Chrome and Edge the Open button keeps a handle to the file, so ↻ can reread it.
  $('file').parentElement.addEventListener('click', (e) => {
    if (!canPick || e.target === $('file')) return;
    e.preventDefault();
    pickFile();
  });

  // Rereads the file from disk with the permission it was opened with; without one,
  // it asks the browser again (Chrome offers "Allow on every visit"), or opens the picker.
  async function fileText(handle, ask) {
    let perm = await handle.queryPermission({ mode: 'read' });
    if (perm === 'prompt' && ask) perm = await handle.requestPermission({ mode: 'read' });
    if (perm !== 'granted') return null;
    return (await handle.getFile()).text();
  }

  $('reload').addEventListener('click', async () => {
    if (!current || current.source !== 'file') return;
    showStale(false);
    const handle = current.handle;
    if (!handle) { pickFile(true); return; }
    let text;
    try { text = await fileText(handle, true); } catch (e) {
      ra.setStatus(`Could not reread ${current.name}: it may have been moved, renamed or deleted. Open it again.`);
      return;
    }
    if (text == null) { ra.setStatus(`Reading ${current.name} again needs your permission. Click ↻ and choose Allow.`); return; }
    showFile(text, handle.name, handle, { reload: true });
  });

  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
  window.addEventListener('drop', (e) => {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
    const f = e.dataTransfer.files[0];
    if (!f) return;
    // Asked for during the drop event itself, while the browser still allows it.
    const item = [...e.dataTransfer.items].find((i) => i.kind === 'file');
    const pending = item && item.getAsFileHandle ? item.getAsFileHandle().catch(() => null) : Promise.resolve(null);
    pending.then((h) => readFile(f, h && h.kind === 'file' ? h : null));
  });

  document.addEventListener('paste', (e) => {
    if (e.target.closest && e.target.closest('input, select, textarea')) return;
    const t = e.clipboardData && e.clipboardData.getData('text/plain');
    if (t && t.trim()) {
      e.preventDefault();
      setCurrent({ name: 'Pasted text', text: t, source: 'paste', loadedAt: Date.now() });
      loadMarkdown(t, 'Pasted text');
    }
  });

  // ======================================================================
  // 13. Start-up: the last document if there is one, else the sample
  // ======================================================================
  function savedDoc() {
    try {
      const d = JSON.parse(localStorage.getItem(LAST_DOC));
      return d && typeof d.text === 'string' && typeof d.name === 'string' ? d : null;
    } catch { return null; }
  }

  // If the browser still lets us read the file (Chrome's "Allow on every visit"), show its current version.
  // If it wants a click first, say that the copy shown may be old, and check the file on the next
  // click: the notice's button, or Play / Space, which then read the current version.
  async function refreshFromDisk() {
    const handle = await fileStore.get();
    if (!handle || !current || current.source !== 'file' || handle.name !== current.name) return;
    current.handle = handle;
    try {
      const text = await fileText(handle, false);
      if (text != null) await showFile(text, handle.name, handle, { reload: true, quiet: true });
      else showStale(true);
    } catch { /* moved or deleted: keep the saved copy */ }
  }

  function showStale(on) {
    needsCheck = on;
    $('stale').hidden = !on;
    if (on) $('staleText').textContent = `This is the copy of ${current.name} saved ${ago(current.loadedAt)}. The file may have changed since.`;
  }

  async function checkFile() {
    showStale(false);
    const name = current.name;
    try {
      const text = await fileText(current.handle, true);
      if (text == null) { ra.setStatus(`Showing the saved copy: the browser did not allow reading ${name}. Click ↻ to try again.`); return; }
      await showFile(text, name, current.handle, { reload: true });
    } catch {
      ra.setStatus(`Could not reread ${name}: it may have been moved, renamed or deleted. Showing the saved copy.`);
    }
  }
  $('loadLatest').addEventListener('click', checkFile);

  // Play and Space check the file first (they count as the click the browser needs), then play.
  const checkThenPlay = (e) => {
    e.preventDefault();
    e.stopImmediatePropagation();
    checkFile().then(() => ra.play());
  };
  window.addEventListener('click', (e) => {
    if (needsCheck && e.target.closest && e.target.closest('#play')) checkThenPlay(e);
  }, true);
  window.addEventListener('keydown', (e) => {
    const t = e.target;
    if (!needsCheck || e.code !== 'Space' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (t.closest && t.closest('input, select, textarea, button, label')) return;
    checkThenPlay(e);
  }, true);

  if (!window.markdownit) {
    ra.setStatus('Could not load the Markdown renderer. Check your internet connection and reload.');
  } else {
    const last = savedDoc();
    if (last) current = { ...last, loadedAt: last.loadedAt || Date.now() };
    showLoaded();
    (last ? loadMarkdown(last.text, last.name).then(refreshFromDisk) : showSample()).then(() => {
      if (ra.needsKey()) ra.openSettings('Paste your ElevenLabs API key to use ElevenLabs voices, or switch Engine to "System voice" in Settings.');
    });
  }
})();
</script>
</body>
</html>
